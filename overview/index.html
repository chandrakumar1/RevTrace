<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>RevTrace — measuring the revenue a recovery actually caused</title>
    <meta
      name="description"
      content="Not every recovered payment was recovered because of us. RevTrace measures the revenue a recovery intervention actually caused, against a randomised holdout. Synthetic demonstration."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="author" content="RevTrace" />

    <!--
      Social preview.

      The image URLs are absolute and point at the canonical host. The
      OpenGraph spec asks for absolute URLs, and some scrapers — X/Twitter's in
      particular — have historically refused to resolve a relative one, so a
      relative path only works by the good grace of whichever crawler is asked.

      Both image URLs must stay on the same host as the deployed page. If the
      site ever moves, they move with it.

      The image itself is 1200×630 and is generated from `design/og.html` —
      it prints no figures, so it cannot carry a stale number. `favicon.svg`
      stays relative: a browser resolves it against the document, and a
      hard-coded host there would break local development.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RevTrace" />
    <meta property="og:title" content="RevTrace — measuring the revenue a recovery actually caused" />
    <meta
      property="og:description"
      content="Gross recovery counts the money. Incremental recovery counts the cause. A synthetic, offline demonstration."
    />
    <meta property="og:image" content="https://revtrace-overview.onrender.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RevTrace — Not every recovered payment was recovered because of us. A bar showing the share of recovered revenue the intervention caused against the share that would have arrived anyway."
    />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RevTrace — measuring the revenue a recovery actually caused" />
    <meta
      name="twitter:description"
      content="Gross recovery counts the money. Incremental recovery counts the cause. A synthetic, offline demonstration."
    />
    <meta name="twitter:image" content="https://revtrace-overview.onrender.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="RevTrace — Not every recovered payment was recovered because of us."
    />

    <!--
      The ground colour is set on the document itself so the first paint is the
      site's dark field rather than a white flash before CSS resolves.
    -->
    <style>
      html,
      body {
        background: #0b0d12;
      }

      /* The skip link lives here so it works from the very first paint. */
      .skip {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 100;
        padding: 0.75rem 1.1rem;
        background: #0b0d12;
        color: #fff;
        border: 1px solid #4b5563;
        border-radius: 3px;
        font: 600 0.85rem/1 system-ui, sans-serif;
        text-decoration: none;
      }

      .skip:focus {
        left: 1rem;
        top: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; color: #e5e7eb; font: 16px/1.6 system-ui, sans-serif">
        <h1 style="font-size: 1.6rem; margin: 0 0 1rem">RevTrace</h1>
        <p style="margin: 0 0 1rem; max-width: 60ch; color: #9ca3af">
          RevTrace measures the revenue a recovery intervention actually caused — not merely
          the money that happened to come back. This overview needs JavaScript for its
          scenes, but the project itself is linked below.
        </p>
        <p style="margin: 0">
          <a style="color: #5eead4" href="https://revtrace-frontend.onrender.com"
            >Open RevTrace</a
          >
          &nbsp;·&nbsp;
          <a style="color: #5eead4" href="https://github.com/chandrakumar1/RevTrace"
            >View source</a
          >
        </p>
        <p style="margin: 1.5rem 0 0; color: #9ca3af; font-size: 0.85rem">
          Synthetic / offline demonstration — no real Razorpay transaction.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
