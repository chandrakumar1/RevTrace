[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revtrace-backend"
version = "0.0.0"
description = "RevTrace — AI revenue recovery system (Razorpay Buildathon, Track 03)"
readme = "README.md"
requires-python = ">=3.13,<3.14"

# NOTE (Phase 0): dependencies are DECLARED here only.
# Nothing has been installed. Installation happens in Phase 1.
# Lower bounds are intentionally loose; exact versions get locked at
# first install and recorded then.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # Hypothesis agent. One OpenAI-compatible client serves every provider
    # (OpenRouter primary, Featherless fallback) — the API shape is the same,
    # only `base_url`, the model and the schema mode differ.
    #
    # Structured output only. No tools are ever declared: the agent has no
    # filesystem, shell, database or web capability by construction.
    #
    # Brings `httpx2` alongside the existing `httpx`. They are separate
    # distributions and coexist; their types are NOT interchangeable, so an
    # `httpx.Timeout` must never reach this client.
    "openai>=3.6,<4",
    # Phase 8. The official SDK rather than raw HTTP: it carries Razorpay's
    # own signature-verification primitive, so our HMAC cannot drift from
    # theirs, and it removes the need to infer request shapes.
    #
    # 2.x specifically: 1.4.x imports `pkg_resources`, which Python 3.13 no
    # longer ships.
    "razorpay>=2,<3",
]

# Deliberately NOT declared yet — these belong to later milestones and
# declaring them now would pre-commit architectural choices Phase 0 has
# no mandate to make:

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests run against revtrace_test only, never revtrace_dev.
markers = [
    "db: requires the revtrace_test PostgreSQL database; skipped when unreachable",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship targets from quoted forward references via
# its class registry at mapper-configuration time. Unquoting them (UP037) would
# make resolution depend on module globals, where the TYPE_CHECKING-only
# imports are absent at runtime.
"app/models/*.py" = ["UP037"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_return_any = true

# The Razorpay SDK ships no py.typed marker and no stubs. Scoped to that
# package alone: the untyped surface is confined to
# `app/integrations/razorpay/`, which is exactly the boundary the adapter
# exists to hold, and everything past it is typed by our own contracts.
[[tool.mypy.overrides]]
module = ["razorpay.*"]
ignore_missing_imports = true
